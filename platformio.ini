; ==============================================================================
;  T-Dongle-S3 Diagnostic & Pentest Tool  -  PlatformIO project configuration
; ==============================================================================
;
;  Target : LilyGo T-Dongle-S3 (ESP32-S3, 16MB flash, 512KB SRAM, NO PSRAM)
;  USB    : Native USB in OTG / TinyUSB mode so we can expose a composite
;           CDC (serial) + HID (keyboard/mouse) + MSC (SD as mass storage) device.
;
;  Build : pio run
;  Flash : pio run -t upload            (device on /dev/cu.usbmodem*)
;  Serial: pio device monitor -b 115200
;
;  If a flash fails after a TinyUSB firmware is already running, hold the BOOT
;  button while replugging the dongle to force ROM download mode, then upload.
; ==============================================================================

[platformio]
default_envs = tdongle-s3
boards_dir   = boards

[env:tdongle-s3]
platform  = espressif32@6.12.0
framework = arduino
board     = tdongle_s3_otg

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time

lib_deps =
    fastled/FastLED @ 3.9.12
    bodmer/TFT_eSPI @ 2.5.43

build_flags =
    ; ----------------------------------------------------------------------
    ; USB: OTG / TinyUSB composite device (CDC + HID + MSC)
    ; ----------------------------------------------------------------------
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

    ; ----------------------------------------------------------------------
    ; TFT_eSPI configuration for the T-Dongle-S3 ST7735 (160x80) panel.
    ; Defined here (not by editing the shared library) for maintainability.
    ; USER_SETUP_LOADED makes TFT_eSPI ignore its bundled User_Setup.h.
    ; ----------------------------------------------------------------------
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=LOW
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

; --------------------------------------------------------------------------
;  Diagnostic environment: bare-minimum, no extra libs, no TFT_eSPI flags
; --------------------------------------------------------------------------
[env:diag]
platform  = espressif32@6.12.0
framework = arduino
board     = dongles3

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time

src_filter = +<main.cpp> +<bsp_lcd/>

lib_deps =
    fastled/FastLED @ 3.9.12

build_flags =
    -DCORE_DEBUG_LEVEL=5
